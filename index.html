<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Junk Foods Recipes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body onload="loadJunkFood()">

    <div class="container">
        <h1 class="text-center my-4">Junk Food Recipes</h1>
        <div class="row" id="target"></div>
    </div>

    <script>
        async function loadJunkFood() {
            try {
                let response = await fetch('https://dummyjson.com/recipes');
                let data = await response.json();

                console.log("API Response:", data); 
                
                let recipes = data.recipes || [];

                
                let junkFoodKeywords = ["snack", "burger", "fries", "pizza", "hot dog", "fried", "chips", "nuggets", "donut", "soda", "taco", "nachos", "wings"];
                
                let junkFoodRecipes = recipes.filter(recipe => 
                    recipe.mealType?.some(type => ["snack", "fast food", "lunch", "dinner"].includes(type.toLowerCase())) ||
                    junkFoodKeywords.some(keyword => recipe.name.toLowerCase().includes(keyword))
                );

                console.log("Filtered Recipes:", junkFoodRecipes); 

                let target = document.getElementById('target');
                target.innerHTML = ""; 

                if (junkFoodRecipes.length === 0) {
                    target.innerHTML = "<p class='text-center'>No junk food recipes found.</p>";
                    return;
                }

              
                while (junkFoodRecipes.length < 30) {
                    junkFoodRecipes = [...junkFoodRecipes, ...junkFoodRecipes].slice(0, 30);
                }

                junkFoodRecipes.slice(2, 26).forEach(recipe => {
                    let card = document.createElement('div');
                    card.classList.add('col-lg-3', 'col-md-4', 'col-sm-6', 'mb-4');
                    card.innerHTML = `
                        <div class="card h-100 shadow">
                        <img src="${recipe.image || 'https://via.placeholder.com/200'}" class="card-img-top" alt="${recipe.name}" height="200px" style="object-fit: cover;"/>
                        <div class="card-body d-flex flex-column">
                        <h5 class="card-title">${recipe.name}</h5>
                        <p class="card-text"><b>Difficulty:</b> ${recipe.difficulty}</p>
                        <p class="card-text"><b>Price:</b> $${recipe.price || 'Varies'}</p>
                        <p class="card-text"><b>Reviews:</b> ⭐ ${recipe.rating || 'N/A'} / 5 (${recipe.reviews || '0'} reviews)</p>
                        <p class="card-text text-muted"><small>Servings: ${recipe.servings || 'N/A'}</small></p>
                        <a href="${recipe.source || '#'}" class="btn btn-primary mt-auto" target="_blank">View Recipe</a>
                        </div>
                    </div>`;
                    target.appendChild(card);
                });
            } catch (error) {
                console.error("Error fetching data:", error);
                document.getElementById('target').innerHTML = "<p class='text-danger text-center'>Failed to load recipes.</p>";
            }
        }
    </script>
</body>
</html>
